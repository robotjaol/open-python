name: python-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[all,development]"
      - name: Lint
        run: ruff check src tests scripts tools 06_model_deployment
      - name: Unit and integration tests
        run: python -m pytest tests -q --ignore=tests/notebook_validation
      - name: Static notebook checks
        run: python -m pytest tests/notebook_validation -q
