[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-lab"
version = "0.1.0"
description = "Paper-driven Python machine learning learning and research laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "robotjaol" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "mlxtend>=0.23",
]

[project.optional-dependencies]
supervised = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2"]
unsupervised = ["umap-learn>=0.5.5", "mlxtend>=0.23"]
reinforcement-learning = ["gymnasium>=0.29", "torch>=2.2"]
deep-learning = ["torch>=2.2"]
visualization = ["plotly>=5.20"]
timeseries = ["statsmodels>=0.14"]
deployment = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]
research = ["requests>=2.31"]
development = [
  "pytest>=8.0",
  "ruff>=0.4",
  "nbformat>=5.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "jupyterlab>=4.1",
  "nbqa>=1.8",
  "pre-commit>=3.7",
]
all = [
  "ml-lab[supervised,unsupervised,reinforcement-learning,visualization,timeseries,deployment,research]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long running tests",
]

[tool.ruff.lint.per-file-ignores]
"src/ml_lab/rl/deep.py" = ["E741", "E702"]
"tools/*.py" = ["E702", "E741", "E731"]
"*.ipynb" = ["E702", "E401", "E402"]
